name: hermes-parro
version: "1.0"
description: "Read and reply to Parro school communication. Provides tools for checking messages and announcements, with a browser-based auth flow via /parro-auth."
requires_env:
  - name: PARRO_USERNAME
    description: "Your Parro login email address"
  - name: PARRO_PASSWORD
    description: "Your Parro password"
    secret: true
